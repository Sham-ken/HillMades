<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Account & Orders Portal | Ooty Hills Snacks</title>
  <meta name="description" content="Secure customer account portal for Ooty Hills Snacks. Track live orders, manage delivery addresses, and access instant WhatsApp OTP verification.">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/account.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏔️</text></svg>">
</head>
<body class="account-portal-body">

  <!-- ==================== TOP ENTERPRISE NAVIGATION BAR ==================== -->
  <header class="portal-navbar">
    <div class="portal-nav-inner">
      <a href="/" class="portal-brand-block">
        <div class="portal-logo-icon">🏔️</div>
        <div class="portal-brand-text">
          <h2>Ooty Hills <span class="portal-brand-badge">Customer Portal</span></h2>
        </div>
      </a>

      <div class="portal-nav-actions">
        <a href="/" class="portal-nav-btn secondary">
          <span>← Back to Store</span>
        </a>
        <a href="/shop.html" class="portal-nav-btn primary">
          <span>Shop Catalog 🛍️</span>
        </a>
        <button type="button" class="portal-nav-btn secondary" id="portalHeaderAuthBtn" onclick="handlePortalHeaderAuth()">
          <span id="portalAuthBtnText">Login</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN PORTAL CONTAINER ==================== -->
  <main class="portal-container" id="portalMainContainer">
    <!-- Rendered dynamically by public/js/app.js / accountPortal logic -->
    <div style="text-align: center; padding: 60px 20px; color: #64748b;">
      <div style="font-size: 2.4rem; margin-bottom: 12px; animation: spin 1s infinite linear;">⏳</div>
      <h3 style="font-size: 1.15rem; color: #0f172a;">Loading your account portal...</h3>
    </div>
  </main>

  <!-- ==================== CART DRAWER & COMMON MODALS ==================== -->
  <!-- Cart Drawer -->
  <div class="cart-drawer-overlay" id="cartOverlay">
    <div class="cart-drawer">
      <div class="cart-header">
        <div class="cart-title-row">
          <svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="13" rx="2"></rect><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
          <h3>Your Bag</h3>
        </div>
        <button type="button" class="btn-close-drawer" id="btnCloseCart">✕</button>
      </div>
      <div class="cart-items-list" id="cartItemsList"></div>
      <div class="cart-footer">
        <div class="cart-summary-line">
          <span>Subtotal</span>
          <span class="cart-total-amount" id="cartSubtotal">₹0</span>
        </div>
        <button type="button" class="btn-checkout" id="proceedToCheckoutBtn">
          Proceed to Order <span>→</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Standard Checkout Modal -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Complete Your Order</h3>
        <button type="button" class="btn-close-drawer btn-modal-close">✕</button>
      </div>
      <div class="modal-body">
        <form id="checkoutForm">
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input type="text" id="custName" class="form-control" placeholder="Sham Sanjay" required>
          </div>
          <div class="form-group">
            <label class="form-label">WhatsApp Mobile Number *</label>
            <input type="tel" id="custPhone" class="form-control" placeholder="9876543210" pattern="[0-9]{10}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Delivery Address *</label>
            <textarea id="custAddress" class="form-control" rows="2" placeholder="House / Flat No., Street, Landmark" required></textarea>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
              <label class="form-label">City / Town</label>
              <input type="text" id="custCity" class="form-control" value="Ooty" required>
            </div>
            <div class="form-group">
              <label class="form-label">Pincode</label>
              <input type="text" id="custPincode" class="form-control" placeholder="643001" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Payment Preference</label>
            <select id="custPayment" class="form-control">
              <option value="UPI / GPay on Delivery">UPI / GPay on Delivery (Recommended)</option>
              <option value="Direct WhatsApp Order">Direct WhatsApp Order Confirmation</option>
              <option value="Bank Transfer (NEFT/IMPS)">Bank Transfer (Wholesale)</option>
            </select>
          </div>
          <button type="submit" class="btn-order-whatsapp-submit">
            <span>💬</span> Confirm & Send Order to WhatsApp
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/app.js"></script>
  <script>
    // Initialize Full Page Account Portal View on Load
    document.addEventListener('DOMContentLoaded', () => {
      initAccountPortalPage();
    });
  </script>
</body>
</html>
