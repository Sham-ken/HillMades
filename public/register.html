<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=/login.html?tab=signup">
  <title>Redirecting to Sign Up...</title>
  <script>
    const search = window.location.search;
    const delim = search ? (search.includes('?') ? '&' : '?') : '';
    window.location.replace('/login.html?tab=signup' + (search ? delim + search.replace(/^\?/, '') : ''));
  </script>
</head>
<body style="background: #f7f3ee; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #5a5a5a;">
  <p>Loading Sign Up & Registration...</p>
</body>
</html>
